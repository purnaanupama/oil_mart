# application-desktop.properties (for desktop build)

# MariaDB4j options
mariaDB4j.port=3307
mariaDB4j.dataDir=./data/mariadb          # persistent DB files next to the JAR
app.mariaDB4j.databaseName=oil_mart_db

# datasource (point to the embedded MariaDB process)
spring.datasource.url=jdbc:mariadb://localhost:3307/oil_mart_db
spring.datasource.username=root
spring.datasource.password=                 # MariaDB4j default root often blank; set if you change it
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# server port (your API)
server.port=8080
